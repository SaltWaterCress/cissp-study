<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CISSP Flashcards — MasterGuide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg-subtle:#f6f8fa;--bg-inset:#f0f4f8;
  --border:#d0d7de;--border-muted:#e6eaef;
  --text:#1f2328;--text-muted:#656d76;--text-light:#9198a1;
  --blue:#0969da;--blue-light:#ddf4ff;--blue-border:#54aeff;--blue-dark:#0550ae;
  --green:#1a7f37;--green-light:#dafbe1;
  --red:#cf222e;--red-light:#ffebe9;
  --gold:#9a6700;--gold-light:#fef9c3;
  --shadow-sm:0 1px 3px rgba(31,35,40,.12),0 1px 2px rgba(31,35,40,.06);
  --shadow:0 3px 6px rgba(31,35,40,.12),0 1px 4px rgba(31,35,40,.08);
  --radius:6px;--radius-lg:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg-subtle);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--bg-subtle);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 1.5rem;}
.nav-inner{max-width:1100px;margin:0 auto;width:100%;display:flex;align-items:center;gap:1rem;}
.logo{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.9rem;color:var(--text);display:flex;align-items:center;gap:.5rem;text-decoration:none;}
.logo-icon{width:26px;height:26px;background:var(--blue);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;font-weight:700;}
.nav-back{margin-left:auto;font-size:.82rem;font-weight:500;color:var(--text-muted);text-decoration:none;display:flex;align-items:center;gap:.3rem;padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);transition:all .15s;}
.nav-back:hover{border-color:var(--blue-border);color:var(--blue);}
.nav-stats{display:flex;gap:.5rem;font-family:'JetBrains Mono',monospace;font-size:.72rem;}
.ns{display:flex;align-items:center;gap:.3rem;padding:3px 8px;border-radius:20px;border:1px solid var(--border);background:var(--bg);}
.ns.known{background:var(--green-light);border-color:#82cfaf;color:var(--green);}
.ns.review{background:var(--gold-light);border-color:#e3b341;color:var(--gold);}

/* MAIN */
main{max-width:1100px;margin:0 auto;padding:76px 1.5rem 3rem;}

/* CONTROLS */
.controls{display:flex;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center;}
.mode-group,.domain-group{display:flex;gap:.3rem;flex-wrap:wrap;}
.ctrl-label{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;align-self:center;white-space:nowrap;}
.ctrl-btn{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;padding:4px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text-muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.ctrl-btn:hover{border-color:var(--blue-border);color:var(--blue);}
.ctrl-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.ctrl-reset{margin-left:auto;font-size:.78rem;font-weight:500;color:var(--text-muted);background:var(--bg);border:1px solid var(--border);padding:4px 10px;border-radius:var(--radius);cursor:pointer;font-family:inherit;transition:all .15s;}
.ctrl-reset:hover{border-color:var(--red);color:var(--red);}

/* PROGRESS */
.progress-wrap{margin-bottom:1.25rem;}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.progress-title{font-size:.82rem;font-weight:500;color:var(--text);}
.progress-counts{display:flex;gap:.75rem;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--text-muted);}
.pc{display:flex;align-items:center;gap:.3rem;}
.pc-dot{width:7px;height:7px;border-radius:50%;}
.progress-track{background:var(--border-muted);border-radius:100px;height:5px;overflow:hidden;display:flex;}
.pt-known{background:var(--green);height:100%;border-radius:100px;transition:width .4s;}
.pt-review{background:var(--gold);height:100%;border-radius:100px;transition:width .4s;}

/* PIPS */
.pip-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:1rem;max-width:680px;margin-left:auto;margin-right:auto;}
.pip{width:9px;height:9px;border-radius:50%;background:var(--border-muted);cursor:pointer;transition:all .2s;border:1.5px solid transparent;}
.pip.known{background:var(--green);}
.pip.review{background:var(--gold);}
.pip.current{background:var(--blue);border-color:var(--blue-dark);transform:scale(1.3);}
.pip:hover{transform:scale(1.2);}

/* CARD */
.card-area{display:flex;flex-direction:column;align-items:center;}
.card-counter{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text-muted);text-align:center;margin-bottom:.75rem;}
.card-wrap{width:100%;max-width:680px;height:320px;perspective:1200px;cursor:pointer;margin-bottom:1rem;}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
.card-inner.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;border-radius:var(--radius-lg);padding:1.75rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow);}
.card-front{background:var(--bg);border:1px solid var(--border);}
.card-back{background:var(--bg);border:1px solid var(--blue-border);transform:rotateY(180deg);}
.card-eyebrow{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--text-light);margin-bottom:.75rem;display:flex;align-items:center;gap:.4rem;}
.card-badge{background:var(--bg-subtle);border:1px solid var(--border);border-radius:20px;padding:1px 8px;font-size:.65rem;color:var(--text-muted);}
.card-q{font-size:1rem;font-weight:600;line-height:1.5;color:var(--text);max-width:520px;}
.card-hint{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--text-light);margin-top:1rem;}
.card-a{font-size:.88rem;line-height:1.65;color:var(--text-muted);max-width:520px;}
.card-a strong{color:var(--blue);font-weight:600;}
.card-a em{color:var(--gold);font-style:normal;font-weight:500;}

/* ACTIONS */
.action-row{display:flex;gap:.75rem;width:100%;max-width:680px;margin-bottom:.75rem;}
.action-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.75rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.82rem;font-weight:600;font-family:inherit;transition:all .15s;}
.action-btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-review{border-color:#e3b341;color:var(--gold);}
.btn-review:hover:not(:disabled){background:var(--gold-light);}
.btn-known{border-color:#82cfaf;color:var(--green);}
.btn-known:hover:not(:disabled){background:var(--green-light);}
.btn-skip{flex:0;padding:.75rem 1rem;color:var(--text-muted);}
.btn-skip:hover{border-color:var(--text-light);color:var(--text);}

/* NAV ARROWS */
.nav-row{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;}
.nav-arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:all .15s;color:var(--text-muted);}
.nav-arrow:hover{border-color:var(--blue-border);color:var(--blue);}
.nav-arrow:disabled{opacity:.3;cursor:not-allowed;}
.kbd-hints{display:flex;gap:1rem;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--text-light);flex-wrap:wrap;justify-content:center;}
.kbd{background:var(--bg-subtle);border:1px solid var(--border);border-radius:3px;padding:1px 6px;color:var(--text-muted);}

/* COMPLETE */
.complete-screen{display:none;max-width:480px;margin:0 auto;text-align:center;padding:3rem 2rem;}
.complete-screen.show{display:block;}
.complete-icon{font-size:3rem;margin-bottom:1rem;}
.complete-title{font-size:1.25rem;font-weight:700;color:var(--text);margin-bottom:.4rem;}
.complete-sub{font-size:.88rem;color:var(--text-muted);margin-bottom:1.5rem;line-height:1.6;}
.complete-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:1.5rem;}
.cs-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;}
.cs-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.5rem;}
.cs-label{font-size:.72rem;color:var(--text-muted);margin-top:.2rem;}
.complete-btns{display:flex;flex-direction:column;gap:.5rem;}

/* RESPONSIVE */
@media(max-width:600px){
  main{padding:70px 1rem 2.5rem;}
  .card-wrap{height:260px;}
  .card-q{font-size:.92rem;}
  .action-row{flex-wrap:wrap;}
  .btn-skip{flex:1;}
  .nav-stats{display:none;}
  .complete-stats{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <div class="logo-icon">C²</div>
      CISSP Flashcards
    </a>
    <div class="nav-stats">
      <div class="ns known">✓ <span id="nsKnown">0</span> known</div>
      <div class="ns review">↺ <span id="nsReview">0</span> review</div>
      <div class="ns"><span id="nsTotal">0</span> total</div>
    </div>
    <a class="nav-back" href="index.html">← Study guide</a>
  </div>
</nav>

<main>
  <div class="controls">
    <span class="ctrl-label">Mode:</span>
    <div class="mode-group">
      <button class="ctrl-btn active" onclick="setMode('all',this)">All cards</button>
      <button class="ctrl-btn" onclick="setMode('review',this)">Review again</button>
      <button class="ctrl-btn" onclick="setMode('unknown',this)">Not yet seen</button>
      <button class="ctrl-btn" onclick="setMode('known',this)">Known</button>
    </div>
    <button class="ctrl-reset" onclick="resetAll()">Reset progress</button>
  </div>
  <div class="controls" style="margin-top:-.5rem;">
    <span class="ctrl-label">Domain:</span>
    <div class="domain-group">
      <button class="ctrl-btn active" onclick="filterDomain('all',this)">All</button>
      <button class="ctrl-btn" onclick="filterDomain('D1',this)">D1</button>
      <button class="ctrl-btn" onclick="filterDomain('D2',this)">D2</button>
      <button class="ctrl-btn" onclick="filterDomain('D3',this)">D3</button>
      <button class="ctrl-btn" onclick="filterDomain('D4',this)">D4</button>
      <button class="ctrl-btn" onclick="filterDomain('D5',this)">D5</button>
      <button class="ctrl-btn" onclick="filterDomain('D6',this)">D6</button>
      <button class="ctrl-btn" onclick="filterDomain('D7',this)">D7</button>
      <button class="ctrl-btn" onclick="filterDomain('D8',this)">D8</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-header">
      <div class="progress-title" id="progressTitle">Loading...</div>
      <div class="progress-counts">
        <div class="pc"><div class="pc-dot" style="background:var(--green)"></div><span id="pcKnown">0</span> known</div>
        <div class="pc"><div class="pc-dot" style="background:var(--gold)"></div><span id="pcReview">0</span> review</div>
        <div class="pc"><div class="pc-dot" style="background:var(--border-muted)"></div><span id="pcUnseen">0</span> unseen</div>
      </div>
    </div>
    <div class="progress-track">
      <div class="pt-known" id="ptKnown" style="width:0%"></div>
      <div class="pt-review" id="ptReview" style="width:0%"></div>
    </div>
  </div>

  <div class="card-area" id="cardArea">
    <div class="card-counter"><span id="cardNum">1</span> of <span id="cardTotal">—</span></div>
    <div class="pip-row" id="pipRow"></div>
    <div class="card-wrap" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="card-eyebrow"><span id="cardBadgeFront" class="card-badge">D1</span><span>question</span></div>
          <div class="card-q" id="cardQ">Loading...</div>
          <div class="card-hint">click to reveal answer</div>
        </div>
        <div class="card-face card-back">
          <div class="card-eyebrow"><span id="cardBadgeBack" class="card-badge">D1</span><span style="color:var(--blue)">answer</span></div>
          <div class="card-a" id="cardA">Loading...</div>
        </div>
      </div>
    </div>
    <div class="action-row" id="actionRow" style="display:none;">
      <button class="action-btn btn-review" onclick="markCard('review')">↺ Review again</button>
      <button class="action-btn btn-known" onclick="markCard('known')">✓ Got it</button>
      <button class="action-btn btn-skip" onclick="nextCard()">→</button>
    </div>
    <div class="nav-row">
      <button class="nav-arrow" id="prevBtn" onclick="prevCard()">←</button>
      <div class="kbd-hints">
        <span><span class="kbd">Space</span> flip</span>
        <span><span class="kbd">← →</span> navigate</span>
        <span><span class="kbd">K</span> known</span>
        <span><span class="kbd">R</span> review</span>
      </div>
      <button class="nav-arrow" id="nextBtn" onclick="nextCard()">→</button>
    </div>
  </div>

  <div class="complete-screen" id="completeScreen">
    <div class="complete-icon" id="completeIcon">🎉</div>
    <div class="complete-title" id="completeTitle">Deck complete!</div>
    <div class="complete-sub" id="completeSub"></div>
    <div class="complete-stats">
      <div class="cs-card"><div class="cs-num" style="color:var(--green)" id="csKnown">0</div><div class="cs-label">Known</div></div>
      <div class="cs-card"><div class="cs-num" style="color:var(--gold)" id="csReview">0</div><div class="cs-label">Review</div></div>
      <div class="cs-card"><div class="cs-num" style="color:var(--blue)" id="csPct">0%</div><div class="cs-label">Score</div></div>
    </div>
    <div class="complete-btns">
      <button class="action-btn btn-review" style="flex:none;width:100%;justify-content:center;" onclick="setMode('review',document.querySelectorAll('.mode-group .ctrl-btn')[1])">↺ Study review cards</button>
      <button class="action-btn btn-skip" style="flex:none;width:100%;justify-content:center;" onclick="setMode('all',document.querySelectorAll('.mode-group .ctrl-btn')[0])">Start over</button>
    </div>
  </div>
</main>

<script>
const CARDS=[
  {id:1,domain:"D1",dn:"Risk Management",q:"What does the CIA Triad stand for?",a:"<strong>Confidentiality</strong> — prevent unauthorized disclosure<br><strong>Integrity</strong> — prevent unauthorized modification<br><strong>Availability</strong> — ensure authorized access when needed<br><em>The three foundational pillars of information security.</em>"},
  {id:2,domain:"D1",dn:"Risk Management",q:"What is the formula for ALE?",a:"<strong>ALE = SLE × ARO</strong><br>SLE = Asset Value × Exposure Factor<br>ARO = Annual Rate of Occurrence<br><em>Example: $200K SLE × 0.5 ARO = $100K/year</em>"},
  {id:3,domain:"D1",dn:"Risk Management",q:"What are the four risk response options?",a:"<strong>Accept</strong> — live with the risk<br><strong>Transfer</strong> — shift to third party (insurance)<br><strong>Avoid</strong> — eliminate the activity<br><strong>Mitigate</strong> — reduce likelihood or impact<br><em>Mnemonic: ATAM</em>"},
  {id:4,domain:"D1",dn:"Risk Management",q:"What is the difference between Due Care and Due Diligence?",a:"<strong>Due Care</strong> — doing what a reasonable person would do<br><strong>Due Diligence</strong> — ongoing research to maintain due care<br><em>Due Care = doing it. Due Diligence = researching what to do.</em>"},
  {id:5,domain:"D1",dn:"Risk Management",q:"What is the highest priority canon of the ISC² Code of Ethics?",a:"<strong>Protect society, the common good, public trust and confidence.</strong><br><em>Priority: Society → Honorably → Competent → Advance profession</em><br>Society ALWAYS wins over employer interest."},
  {id:6,domain:"D1",dn:"Risk Management",q:"What is the difference between BCP and DRP?",a:"<strong>BCP</strong> — maintains business operations (long-term, business-wide)<br><strong>DRP</strong> — restores IT systems (tactical, IT-focused)<br><em>DRP is a subset of BCP.</em>"},
  {id:7,domain:"D1",dn:"Risk Management",q:"What are the NIST CSF 5 core functions?",a:"<strong>Identify → Protect → Detect → Respond → Recover</strong>"},
  {id:8,domain:"D2",dn:"Asset Security",q:"What is the difference between a Data Owner and Data Custodian?",a:"<strong>Data Owner</strong> — business manager, accountable, sets classification<br><strong>Data Custodian</strong> — IT dept, implements controls, not accountable<br><em>Owner decides. Custodian implements.</em>"},
  {id:9,domain:"D2",dn:"Asset Security",q:"What are the government data classification levels?",a:"<strong>Top Secret → Secret → Confidential → Unclassified</strong><br><em>Commercial: Confidential/Proprietary → Private → Sensitive → Public</em>"},
  {id:10,domain:"D2",dn:"Asset Security",q:"What are the three states of data?",a:"<strong>Data at Rest</strong> — stored. Protect with: encryption, access controls<br><strong>Data in Transit</strong> — moving. Protect with: TLS, VPN, HTTPS<br><strong>Data in Use</strong> — in RAM/CPU. Hardest to protect."},
  {id:11,domain:"D2",dn:"Asset Security",q:"What is crypto-shredding?",a:"<strong>Crypto-shredding</strong> = destroying encryption keys to render encrypted data permanently unreadable<br><em>Best method for cloud-hosted data where physical destruction isn't possible.</em>"},
  {id:12,domain:"D2",dn:"Asset Security",q:"GDPR breach notification timeframe?",a:"<strong>72 hours</strong> from becoming aware of a personal data breach.<br><em>Key rights: erasure, data portability, minimization, purpose limitation.</em>"},
  {id:13,domain:"D3",dn:"Architecture & Engineering",q:"Bell-LaPadula — two main rules?",a:"<strong>No Read Up</strong> — Simple Security Property<br><strong>No Write Down</strong> — Star Property (*)<br><em>Goal: Confidentiality. Military model.</em>"},
  {id:14,domain:"D3",dn:"Architecture & Engineering",q:"Biba Model — two main rules?",a:"<strong>No Read Down</strong> — Simple Integrity Axiom<br><strong>No Write Up</strong> — Star Integrity Property (*)<br><em>Goal: Integrity. Opposite of Bell-LaPadula.</em>"},
  {id:15,domain:"D3",dn:"Architecture & Engineering",q:"What is the Clark-Wilson model?",a:"<strong>Goal: Integrity</strong> through well-formed transactions<br><strong>CDI</strong> = Constrained Data Item<br><strong>TP</strong> = Transformation Procedure (only way to modify CDI)<br><strong>IVP</strong> = Integrity Verification Procedure<br><em>Commercial/banking environments.</em>"},
  {id:16,domain:"D3",dn:"Architecture & Engineering",q:"Symmetric vs Asymmetric encryption — key difference?",a:"<strong>Symmetric</strong> — same key. Fast. AES, 3DES. Key distribution problem.<br><strong>Asymmetric</strong> — key pair. Slow. RSA, ECC. Solves key distribution.<br><em>Hybrid = asymmetric for key exchange, symmetric for data. How TLS works.</em>"},
  {id:17,domain:"D3",dn:"Architecture & Engineering",q:"IPSec — AH vs ESP?",a:"<strong>AH</strong> — authentication + integrity ONLY. No encryption.<br><strong>ESP</strong> — encryption + authentication + integrity. ✅<br><em>Use ESP when you need confidentiality.</em>"},
  {id:18,domain:"D3",dn:"Architecture & Engineering",q:"What is Fail Secure?",a:"<strong>Fail Secure</strong> — system defaults to denied/locked state on failure.<br>Example: Firewall crash → block all traffic.<br><em>Fail Safe = prioritizes human safety (e.g. fire door unlocks on power failure).</em>"},
  {id:19,domain:"D4",dn:"Network Security",q:"OSI 7 layers top to bottom?",a:"<strong>7</strong> Application · <strong>6</strong> Presentation · <strong>5</strong> Session · <strong>4</strong> Transport · <strong>3</strong> Network · <strong>2</strong> Data Link · <strong>1</strong> Physical<br><em>All People Seem To Need Data Processing</em>"},
  {id:20,domain:"D4",dn:"Network Security",q:"WEP vs WPA2 vs WPA3 — which are acceptable?",a:"<strong>WEP</strong> — BROKEN. ❌ Never use.<br><strong>WPA</strong> — TKIP. Deprecated. ❌<br><strong>WPA2</strong> — AES/CCMP. Strong. ✅<br><strong>WPA3</strong> — SAE. Forward secrecy. Current standard. ✅"},
  {id:21,domain:"D4",dn:"Network Security",q:"IDS vs IPS — key difference?",a:"<strong>IDS</strong> — detects and alerts only. Passive. Out-of-band.<br><strong>IPS</strong> — detects and blocks. Active. Inline deployment.<br><em>Signature-based = known attacks. Anomaly-based = detects new attacks, more false positives.</em>"},
  {id:22,domain:"D4",dn:"Network Security",q:"What is a replay attack and prevention?",a:"<strong>Replay attack</strong> — capturing valid auth data and resending it later.<br><em>Prevention:</em> Timestamps, nonces, sequence numbers, challenge-response auth."},
  {id:23,domain:"D5",dn:"Identity & Access Management",q:"Identification vs Authentication vs Authorization?",a:"<strong>Identification</strong> — claiming identity (username)<br><strong>Authentication</strong> — proving identity (password, MFA)<br><strong>Authorization</strong> — what you're permitted to do<br><strong>Accountability</strong> — logging actions (audit trail)"},
  {id:24,domain:"D5",dn:"Identity & Access Management",q:"What are the three authentication factors?",a:"<strong>Something you Know</strong> — password, PIN<br><strong>Something you Have</strong> — token, smart card, OTP<br><strong>Something you Are</strong> — biometrics<br><em>MFA = 2+ DIFFERENT factor types. Password + PIN = NOT MFA!</em>"},
  {id:25,domain:"D5",dn:"Identity & Access Management",q:"DAC vs MAC vs RBAC?",a:"<strong>DAC</strong> — owner controls access. Most flexible. Least secure.<br><strong>MAC</strong> — system enforces via labels. Most secure. Government.<br><strong>RBAC</strong> — access by job role. Most common in enterprise."},
  {id:26,domain:"D5",dn:"Identity & Access Management",q:"FAR, FRR, and CER in biometrics?",a:"<strong>FAR</strong> (Type II) = False Acceptance — unauthorized ACCEPTED. Security risk!<br><strong>FRR</strong> (Type I) = False Rejection — authorized REJECTED. Usability issue.<br><strong>CER/EER</strong> = where FAR = FRR. Lower = better system."},
  {id:27,domain:"D5",dn:"Identity & Access Management",q:"How does Kerberos work?",a:"1. Authenticate to <strong>AS</strong> → get TGT<br>2. Present TGT to <strong>TGS</strong> → get service ticket<br>3. Use service ticket to access resource<br><em>Ticket-based SSO. Port 88. Used in Active Directory.</em>"},
  {id:28,domain:"D6",dn:"Assessment & Testing",q:"Vulnerability Assessment vs Penetration Testing?",a:"<strong>VA</strong> — identifies weaknesses. Non-destructive. No exploitation.<br><strong>PT</strong> — actively exploits. Simulates attacker. Demonstrates impact.<br><em>Both require written authorization and Rules of Engagement.</em>"},
  {id:29,domain:"D6",dn:"Assessment & Testing",q:"Black box vs White box vs Gray box testing?",a:"<strong>Black Box</strong> — no prior knowledge. Most realistic.<br><strong>White Box</strong> — full knowledge. Most thorough.<br><strong>Gray Box</strong> — partial knowledge. Most common in real engagements."},
  {id:30,domain:"D6",dn:"Assessment & Testing",q:"MTTD, MTTR, MTBF — what do they mean?",a:"<strong>MTTD</strong> — Mean Time To Detect<br><strong>MTTR</strong> — Mean Time To Repair/Restore<br><strong>MTBF</strong> — Mean Time Between Failures<br><strong>Availability = MTBF ÷ (MTBF + MTTR)</strong>"},
  {id:31,domain:"D7",dn:"Security Operations",q:"NIST SP 800-61 Incident Response phases?",a:"<strong>P</strong>reparation → <strong>I</strong>dentification → <strong>C</strong>ontainment → <strong>E</strong>radication → <strong>R</strong>ecovery → <strong>L</strong>essons Learned<br><em>Containment = FIRST active step. PICERL mnemonic.</em>"},
  {id:32,domain:"D7",dn:"Security Operations",q:"Order of Volatility in digital forensics?",a:"<strong>1.</strong> CPU registers & cache (most volatile)<br><strong>2.</strong> RAM<br><strong>3.</strong> Swap/page file<br><strong>4.</strong> Disk storage<br><strong>5.</strong> Remote/cloud logs (least volatile)<br><em>Always collect most volatile FIRST.</em>"},
  {id:33,domain:"D7",dn:"Security Operations",q:"Hot vs Warm vs Cold Site?",a:"<strong>Hot Site</strong> — ready immediately. Most expensive.<br><strong>Warm Site</strong> — hours to activate. Medium cost.<br><strong>Cold Site</strong> — days/weeks. Cheapest.<br><em>Hot price = Hot response</em>"},
  {id:34,domain:"D7",dn:"Security Operations",q:"What is Chain of Custody?",a:"<strong>Chain of Custody</strong> — documented record of who handled evidence and when.<br>Required for admissibility in legal proceedings.<br><em>Breaking chain of custody = evidence may be inadmissible.</em>"},
  {id:35,domain:"D7",dn:"Security Operations",q:"Incremental vs Differential backups?",a:"<strong>Incremental</strong> — since last backup. Fastest backup, slowest restore.<br><strong>Differential</strong> — since last FULL backup. Slower backup, faster restore.<br><em>Full = slowest backup, fastest restore (1 set only).</em>"},
  {id:36,domain:"D8",dn:"Software Dev Security",q:"OWASP Top 10 — key vulnerabilities?",a:"<strong>A01</strong> Broken Access Control<br><strong>A02</strong> Cryptographic Failures<br><strong>A03</strong> Injection (SQLi, XSS)<br><strong>A05</strong> Security Misconfiguration<br><strong>A10</strong> SSRF"},
  {id:37,domain:"D8",dn:"Software Dev Security",q:"What does 'Shift Left' mean in DevSecOps?",a:"<strong>Shift Left</strong> = integrate security earlier in the SDLC.<br>Test during design and coding, not just at deployment.<br><em>Bug in requirements = 1x cost to fix. In production = 100x cost.</em>"},
  {id:38,domain:"D8",dn:"Software Dev Security",q:"SAST vs DAST?",a:"<strong>SAST</strong> — analyzes source code WITHOUT running it. Finds issues early. White-box.<br><strong>DAST</strong> — tests RUNNING application. Finds runtime issues. Black-box.<br><em>Both are needed.</em>"},
  {id:39,domain:"D8",dn:"Software Dev Security",q:"What is SQL Injection and prevention?",a:"<strong>SQL Injection</strong> — malicious SQL inserted via user input to manipulate DB queries.<br><em>Prevention:</em> Parameterized queries (prepared statements), input validation, least-privilege DB accounts."},
  {id:40,domain:"D8",dn:"Software Dev Security",q:"What is an SBOM?",a:"<strong>SBOM</strong> (Software Bill of Materials) — complete inventory of all components, libraries, and dependencies.<br><em>Log4Shell showed why SBOMs matter — one vulnerable library affected thousands of products.</em>"},
];

let states={},domain='all',mode='all',deck=[],idx=0,flipped=false;

function save(){try{localStorage.setItem('cissp_fc_v3',JSON.stringify(states));}catch(e){}}
function load(){try{const s=localStorage.getItem('cissp_fc_v3');if(s)states=JSON.parse(s);}catch(e){}}
function resetAll(){if(!confirm('Reset all progress? This cannot be undone.'))return;states={};save();buildDeck();}

function buildDeck(){
  let c=CARDS;
  if(domain!=='all')c=c.filter(x=>x.domain===domain);
  if(mode==='review')c=c.filter(x=>states[x.id]==='review');
  else if(mode==='known')c=c.filter(x=>states[x.id]==='known');
  else if(mode==='unknown')c=c.filter(x=>!states[x.id]);
  deck=c;idx=0;
  if(!deck.length){showComplete();return;}
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('cardArea').style.display='flex';
  showCard();updateProgress();buildPips();
}

function showCard(){
  if(!deck.length){showComplete();return;}
  flipped=false;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('actionRow').style.display='none';
  const c=deck[idx];
  const label=c.domain+' · '+c.dn;
  document.getElementById('cardBadgeFront').textContent=label;
  document.getElementById('cardBadgeBack').textContent=label;
  document.getElementById('cardQ').textContent=c.q;
  document.getElementById('cardA').innerHTML=c.a;
  document.getElementById('cardNum').textContent=idx+1;
  document.getElementById('cardTotal').textContent=deck.length;
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').disabled=idx===deck.length-1;
  updatePips();
}

function flipCard(){
  flipped=!flipped;
  document.getElementById('cardInner').classList.toggle('flipped',flipped);
  document.getElementById('actionRow').style.display=flipped?'flex':'none';
}

function markCard(s){states[deck[idx].id]=s;save();updateProgress();updatePips();updateNavStats();setTimeout(nextCard,300);}
function nextCard(){if(idx<deck.length-1){idx++;showCard();}else showComplete();}
function prevCard(){if(idx>0){idx--;showCard();}}

function updateProgress(){
  const base=CARDS.filter(c=>domain==='all'||c.domain===domain);
  const tot=base.length;
  const k=base.filter(c=>states[c.id]==='known').length;
  const r=base.filter(c=>states[c.id]==='review').length;
  const u=tot-k-r;
  document.getElementById('pcKnown').textContent=k;
  document.getElementById('pcReview').textContent=r;
  document.getElementById('pcUnseen').textContent=u;
  document.getElementById('ptKnown').style.width=(k/tot*100)+'%';
  document.getElementById('ptReview').style.width=(r/tot*100)+'%';
  const pct=Math.round((k+r)/tot*100);
  document.getElementById('progressTitle').textContent=`${pct}% covered — ${k} known, ${r} to review, ${u} unseen`;
  updateNavStats();
}

function updateNavStats(){
  document.getElementById('nsKnown').textContent=Object.values(states).filter(v=>v==='known').length;
  document.getElementById('nsReview').textContent=Object.values(states).filter(v=>v==='review').length;
  document.getElementById('nsTotal').textContent=CARDS.length;
}

function buildPips(){
  const row=document.getElementById('pipRow');
  const max=Math.min(deck.length,40);
  row.innerHTML='';
  for(let i=0;i<max;i++){
    const p=document.createElement('div');
    p.className='pip';
    p.onclick=(j=>()=>{idx=j;showCard();})(i);
    row.appendChild(p);
  }
  if(deck.length>40){const s=document.createElement('span');s.style.cssText='font-family:JetBrains Mono,monospace;font-size:.65rem;color:var(--text-light);padding-left:4px;';s.textContent=`+${deck.length-40}`;row.appendChild(s);}
  updatePips();
}

function updatePips(){
  document.querySelectorAll('.pip').forEach((p,i)=>{
    p.className='pip';
    if(i===idx)p.classList.add('current');
    else if(deck[i]&&states[deck[i].id]==='known')p.classList.add('known');
    else if(deck[i]&&states[deck[i].id]==='review')p.classList.add('review');
  });
}

function showComplete(){
  document.getElementById('cardArea').style.display='none';
  document.getElementById('completeScreen').classList.add('show');
  const base=CARDS.filter(c=>domain==='all'||c.domain===domain);
  const k=base.filter(c=>states[c.id]==='known').length;
  const r=base.filter(c=>states[c.id]==='review').length;
  const pct=Math.round(k/base.length*100);
  document.getElementById('csKnown').textContent=k;
  document.getElementById('csReview').textContent=r;
  document.getElementById('csPct').textContent=pct+'%';
  document.getElementById('completeIcon').textContent=pct>=80?'🏆':pct>=50?'📚':'💪';
  document.getElementById('completeTitle').textContent=pct>=80?'Excellent work!':pct>=50?'Good progress!':'Keep going!';
  document.getElementById('completeSub').textContent=`${k} of ${base.length} cards marked known (${pct}%).${r>0?` ${r} cards need review.`:' No review cards — great job!'}`;
}

function setMode(m,btn){
  mode=m;
  document.querySelectorAll('.mode-group .ctrl-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('cardArea').style.display='flex';
  buildDeck();
}

function filterDomain(d,btn){
  domain=d;
  document.querySelectorAll('.domain-group .ctrl-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildDeck();
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();flipCard();}
  else if(e.code==='ArrowRight')nextCard();
  else if(e.code==='ArrowLeft')prevCard();
  else if((e.key==='k'||e.key==='K')&&flipped)markCard('known');
  else if((e.key==='r'||e.key==='R')&&flipped)markCard('review');
});

load();buildDeck();
</script>
</body>
</html>
